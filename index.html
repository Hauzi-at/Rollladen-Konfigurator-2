  get: function(key, shared) {
    return new Promise(function(resolve, reject) {
      try {
        var raw = localStorage.getItem("rk_" + key);
        if (raw === null) { reject(new Error("not found")); return; }
        resolve({ key: key, value: raw, shared: !!shared });
      } catch (e) { reject(e); }
    });
  },
  set: function(key, value, shared) {
    return new Promise(function(resolve, reject) {
      try {
        localStorage.setItem("rk_" + key, value);
        resolve({ key: key, value: value, shared: !!shared });
      } catch (e) { reject(e); }
    });
  },
  delete: function(key, shared) {
    return new Promise(function(resolve, reject) {
      try {
        localStorage.removeItem("rk_" + key);
        resolve({ key: key, deleted: true, shared: !!shared });
      } catch (e) { reject(e); }
    });
  },
  list: function(prefix, shared) {
    return new Promise(function(resolve, reject) {
      try {
        var p = "rk_" + (prefix || "");
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);

    });
  }
};
